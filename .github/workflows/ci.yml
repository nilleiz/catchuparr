name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      skip_native:
        description: "Skip native AIO for package/unit-only validation; this cannot provide release evidence"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aio-integration:
    name: AIO integration (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '0.32.0'
            image: ghcr.io/dispatcharr/dispatcharr@sha256:b7d695c5cc98b9abd64c74a94539c1ebffc23d965021613c820c67e25dea41a3
          - version: '0.33.0'
            image: ghcr.io/dispatcharr/dispatcharr@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify changed files
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/ci_provenance.py classify
          --event "$GITHUB_EVENT_NAME"
          --base-sha "$PR_BASE_SHA"
          --head-sha "$PR_HEAD_SHA"
          --output "$GITHUB_OUTPUT"
      - name: Synthetic playback in actual Dispatcharr AIO
        if: steps.classify.outputs.full == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_native)
        run: python scripts/run_aio_integration.py --image ${{ matrix.image }}
      - name: Record explicit manual native AIO skip
        if: github.event_name == 'workflow_dispatch' && inputs.skip_native
        run: echo "::notice title=Native AIO explicitly skipped::This manually requested run is package/unit validation only and cannot satisfy release acceptance."
      - name: Record infrastructure-only validation
        if: steps.classify.outputs.full == 'false'
        run: echo "Native AIO skipped for allowlisted infrastructure-only changes. Release evidence still requires a successful native playback step."

  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint and YAML tools
        run: python -m pip install 'ruff==0.13.3' 'PyYAML==6.0.3'
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q catchuparr scripts tests
      - name: Unit and synthetic-stream tests
        run: python -m unittest discover -s tests -v
      - name: Build importable plugin
        run: python scripts/build_plugin.py
      - name: Check package layout
        run: python -m unittest tests.test_package -v
      - name: Record package provenance
        run: python scripts/ci_provenance.py record --package-root catchuparr --dist-dir dist --output dist/ci-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: catchuparr-plugin
          path: |
            dist/catchuparr-*.zip
            dist/ci-provenance.json
          if-no-files-found: error
