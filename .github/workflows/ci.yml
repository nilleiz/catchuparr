name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aio-integration:
    name: AIO integration (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '0.31.0'
            image: ghcr.io/dispatcharr/dispatcharr@sha256:f81924fa3dbfeb463b3908be7e086bf58aacbd2ba56062bfb555ee3a471acf8f
          - version: '0.32.0'
            image: ghcr.io/dispatcharr/dispatcharr@sha256:b7d695c5cc98b9abd64c74a94539c1ebffc23d965021613c820c67e25dea41a3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic playback in actual Dispatcharr AIO
        run: python scripts/run_aio_integration.py --image ${{ matrix.image }}

  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tool
        run: python -m pip install 'ruff==0.13.3'
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q catchuparr scripts tests
      - name: Unit and synthetic-stream tests
        run: python -m unittest discover -s tests -v
      - name: Build importable plugin
        run: python scripts/build_plugin.py
      - name: Check package layout
        run: python -m unittest tests.test_package -v
      - uses: actions/upload-artifact@v4
        with:
          name: catchuparr-plugin
          path: dist/catchuparr-*.zip
          if-no-files-found: error
