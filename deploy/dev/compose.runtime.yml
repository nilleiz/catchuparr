name: catchuparr-dev

# Portainer stack update after restore, scrub and image compatibility check.
services:
  web:
    image: ${DISPATCHARR_DEV_IMAGE:?pin-compatible-image-digest}
    container_name: catchuparr-dev-web
    restart: unless-stopped
    ports:
      - '${DEV_BIND_IP:?set-in-portainer}:15656:9191'
    environment: &dispatcharr-env
      DISPATCHARR_ENV: modular
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: dispatcharr_dev
      POSTGRES_USER: dispatcharr_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?set-in-portainer}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      DISPATCHARR_PORT: '9191'
      DISPATCHARR_LOG_LEVEL: info
    volumes: &dispatcharr-volumes
      - ${DEV_DATA_ROOT:?set-in-portainer}/data:/data
      - ${DEV_DATA_ROOT:?set-in-portainer}/archive:/data/catchuparr
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private, lan]
  celery:
    image: ${DISPATCHARR_DEV_IMAGE:?pin-compatible-image-digest}
    container_name: catchuparr-dev-celery
    restart: unless-stopped
    entrypoint: [/app/docker/entrypoint.celery.sh]
    environment: *dispatcharr-env
    volumes: *dispatcharr-volumes
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_started}
    networks: [private, lan]
  db:
    image: postgres:17
    container_name: catchuparr-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispatcharr_dev
      POSTGRES_USER: dispatcharr_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?set-in-portainer}
    volumes:
      - ${DEV_DATA_ROOT:?set-in-portainer}/postgres:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dispatcharr_dev -d dispatcharr_dev']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: catchuparr-dev-redis
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  private:
    name: catchuparr-dev-private
    internal: true
  lan:
    name: catchuparr-dev-lan
